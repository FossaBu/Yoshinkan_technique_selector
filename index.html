<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yoshinkan Technique Selector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Yoshinkan Technique Selector</h1>
    <div id="slot-machine">
      <div class="slot" id="slot1">‒‒‒</div>
      <div class="slot" id="slot2">‒‒‒</div>
      <div class="slot" id="slot3">‒‒‒</div>
    </div>
    <button id="lever">Pull&nbsp;Lever</button>
  </div>
  <!-- Overlay for showing the selected technique -->
  <div id="result-overlay" class="hidden">
    <div class="result-card">
      <h2 id="latin-name"></h2>
      <h3 id="japanese-name"></h3>
      <a id="video-link" href="#" target="_blank">View Technique Video</a>
      <div id="suwari-area" class="hidden">
        <p>Try for the suwari‑waza variant? (1 in 6 chance)</p>
        <button id="suwari-spin">Spin Suwari</button>
      </div>
      <button id="close-overlay">Close</button>
    </div>
  </div>
  <script src="dataset.js"></script>
  <script src="script.js"></script>
</body>
</html>
